name: Android Writing Test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asterion-writing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Checkout existing Asterion Art native GGUF inference module
        uses: actions/checkout@v4
        with:
          repository: Azrazieliz/AsterionArt
          ref: 0a1129fd9a03d1e3059a26c0e42eefc3244511c3
          path: art-upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Only this disposable benchmark package uses a cached DEBUG signing identity.
      # Production releases require private owner signing; never reuse this key for them.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: asterion-writing-bench-debug-signing-v1
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Install Android native toolchain
        run: yes | sdkmanager "ndk;27.2.12479018" "cmake;3.31.6" >/dev/null
      - name: Fetch pinned llama.cpp used by Asterion Art
        run: |
          git clone --quiet --depth 1 --branch v0.7.0 https://github.com/ggml-org/llama.cpp.git art-upstream/native/llama.cpp
          test "$(git -C art-upstream/native/llama.cpp rev-parse HEAD)" = "620d2225cc436ab0b001e3200e590e3b286ef9ab"
      - name: Patch only the CI copy of Art's native GGUF engine
        run: python3 scripts/patch_art_brain.py art-upstream/brain
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Kotlin foundation tests
        run: |
          if command -v kotlinc >/dev/null 2>&1; then bash scripts/test-core.sh; else echo "Kotlin CLI absent; Android Kotlin compiler runs in Gradle build"; fi
      - name: Validate specialist training script syntax
        run: python3 -m py_compile scripts/writer_specialist_pipeline.py
      - name: Build installable debug APK
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug --stacktrace
      - name: Verify packaged actual native inference
        run: |
          unzip -l app/build/outputs/apk/debug/*.apk | grep -q 'libai-chat.so'
          unzip -l app/build/outputs/apk/debug/*.apk | grep -q 'classes.dex'
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Writing-v0.4.0-Workspace-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
